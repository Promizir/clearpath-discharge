services:
  - type: web
    name: clearpath-discharge
    runtime: docker
    plan: free
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: AI_PROVIDER
        value: AMD
      - key: AMD_API_KEY
        sync: false
      - key: AMD_BASE_URL
        value: https://developer.amd.com.cn/radeon/api/v1
      - key: AMD_MODEL
        value: DeepSeek-V4-Flash
